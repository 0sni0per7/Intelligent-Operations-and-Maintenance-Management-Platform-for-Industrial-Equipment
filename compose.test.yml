# Run with:
# docker compose --env-file backend/.env.test -f compose.test.yml up -d --wait db-test
services:
  db-test:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: app_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "no"
