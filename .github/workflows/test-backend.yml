name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: industrial-equipment-test-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - name: Generate isolated test environment
        run: |
          set -euo pipefail
          python - <<'PY'
          import secrets
          from pathlib import Path
          from urllib.parse import quote

          password = secrets.token_hex(32)
          database_url = (
              "postgresql+psycopg://postgres:"
              f"{quote(password, safe='')}"
              "@127.0.0.1:5433/app_test"
          )
          path = Path("backend/.env.test")
          path.write_text(
              f"TEST_POSTGRES_PASSWORD={password}\n"
              f"TEST_DATABASE_URL={database_url}\n",
              encoding="utf-8",
          )
          path.chmod(0o600)
          PY
      - name: Start Mailpit
        run: docker compose up -d --wait mailpit
      - name: Start isolated test database
        run: |
          docker compose \
            --env-file backend/.env.test \
            -f compose.test.yml \
            up -d --wait db-test
      - name: Run tests
        run: uv run python scripts/run_isolated_tests.py "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Generate coverage HTML
        if: always()
        run: |
          set -euo pipefail
          test -f .coverage
          uv run coverage html --title "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Clean up isolated test resources
        if: always()
        run: |
          set -euo pipefail
          cleanup_status=0

          if [ -n "$(docker compose ps -q mailpit)" ]; then
            docker compose stop mailpit || cleanup_status=1
            docker compose rm -f mailpit || cleanup_status=1
          fi

          if [ -f backend/.env.test ]; then
            docker compose \
              --env-file backend/.env.test \
              -f compose.test.yml \
              down --volumes --remove-orphans || cleanup_status=1
          fi

          rm -f backend/.env.test || cleanup_status=1
          exit "$cleanup_status"
      - name: Store coverage files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
          if-no-files-found: error
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
